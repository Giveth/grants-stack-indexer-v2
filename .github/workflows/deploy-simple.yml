name: Deploy to AWS (Simplified)

on:
  workflow_dispatch:
    inputs:
            environment:
                type: choice
                description: Environment to deploy to
                required: true
                options:
                    - staging
                    - production
            image_tag:
                type: string
                description: Docker image tag to deploy
                required: false
                default: latest

jobs:
  deploy:
        name: Deploy to ${{ github.event.inputs.environment }}
        runs-on: ubuntu-latest
        environment: ${{ github.event.inputs.environment }}
        env:
            TF_VAR_AWS_REGION: ${{ vars.AWS_REGION }}
            TF_VAR_APP_NAME: ${{ vars.APP_NAME }}
            TF_VAR_APP_ENVIRONMENT: ${{ github.event.inputs.environment }}
            # Database credentials
            TF_VAR_DATALAYER_PG_USER: ${{ secrets.DATALAYER_PG_USER }}
            TF_VAR_DATALAYER_PG_PASSWORD: ${{ secrets.DATALAYER_PG_PASSWORD }}

        steps:
            - name: Check out repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                  terraform_version: ${{ vars.TERRAFORM_VERSION || '1.9.8' }}
                  terraform_wrapper: false

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ vars.AWS_REGION }}

            - name: Initialize Terraform
              working-directory: ./deployment/environments/${{ github.event.inputs.environment }}
              run: |
                  terraform init \
                    -backend-config="bucket=${{ vars.APP_NAME }}-terraform-state" \
                    -backend-config="key=${{ vars.APP_NAME }}/${{ github.event.inputs.environment }}/terraform.tfstate" \
                    -backend-config="region=${{ vars.AWS_REGION }}"

            - name: Validate Terraform
              working-directory: ./deployment/environments/${{ github.event.inputs.environment }}
              run: terraform validate

            - name: Plan and Apply Terraform
              working-directory: ./deployment/environments/${{ github.event.inputs.environment }}
              run: |
                  # Validate that TERRAFORM_VARS is valid JSON
                  if ! jq empty <<< "$TERRAFORM_VARS" >/dev/null 2>&1; then
                    echo "Error: TERRAFORM_VARS is not valid JSON."
                    exit 1
                  fi
                  # Extract only BLUE variables for simplified deployment (excluding COINGECKO_API_KEY which is a separate secret)
                  echo "$TERRAFORM_VARS" | jq '{
                    BLUE_CHAINS: .BLUE_CHAINS,
                    BLUE_COINGECKO_API_TYPE: .BLUE_COINGECKO_API_TYPE,
                    BLUE_PRICING_SOURCE: .BLUE_PRICING_SOURCE,
                    BLUE_METADATA_SOURCE: .BLUE_METADATA_SOURCE,
                    BLUE_PUBLIC_GATEWAY_URLS: .BLUE_PUBLIC_GATEWAY_URLS,
                    BLUE_LOG_LEVEL: .BLUE_LOG_LEVEL,
                    BLUE_INDEXER_GRAPHQL_URL: .BLUE_INDEXER_GRAPHQL_URL,
                    BLUE_DATALAYER_PG_DB_NAME: .BLUE_DATALAYER_PG_DB_NAME
                  }' > tfvars.json
                  # Add the separate COINGECKO_API_KEY secret
                  jq --arg coingecko_key "${{ secrets.COINGECKO_API_KEY }}" '. + {BLUE_COINGECKO_API_KEY: $coingecko_key}' tfvars.json > tfvars_temp.json && mv tfvars_temp.json tfvars.json
                  # Show what variables we extracted
                  echo "Extracted variables for simplified deployment:"
                  cat tfvars.json
                  # Plan and apply with the variables
                  terraform plan -var-file=tfvars.json -out=tfplan
                  terraform apply -auto-approve tfplan
              env:
                  TERRAFORM_VARS: ${{ vars.TERRAFORM_VARS }}

            - name: Get deployment outputs
              working-directory: ./deployment/environments/${{ github.event.inputs.environment }}
              run: |
                  echo "LOAD_BALANCER_DNS=$(terraform output -raw load_balancer_dns_name)" >> $GITHUB_ENV
                  echo "CLUSTER_NAME=$(terraform output -raw cluster_name)" >> $GITHUB_ENV

            - name: Update ECS service (force new deployment)
              run: |
                  aws ecs update-service \
                    --cluster ${{ env.CLUSTER_NAME }} \
                    --service ${{ vars.APP_NAME }}-api-service \
                    --force-new-deployment \
                    --region ${{ vars.AWS_REGION }}

            - name: Wait for deployment to complete
              run: |
                  aws ecs wait services-stable \
                    --cluster ${{ env.CLUSTER_NAME }} \
                    --services ${{ vars.APP_NAME }}-api-service \
                    --region ${{ vars.AWS_REGION }}

            - name: Deployment summary
              run: |
                  echo "🚀 Deployment completed successfully!"
                  echo "Environment: ${{ github.event.inputs.environment }}"
                  echo "Image Tag: ${{ github.event.inputs.image_tag || 'latest' }}"
                  echo "Load Balancer DNS: ${{ env.LOAD_BALANCER_DNS }}"
                  echo "ECS Cluster: ${{ env.CLUSTER_NAME }}"
