name: Destroy Environment

on:
    workflow_dispatch:
        inputs:
            environment:
                type: choice
                description: Environment to check
                required: true
                options:
                    - staging
                    - production

jobs:
    destroy:
        name: Destroy ${{ github.event.inputs.environment }}
        runs-on: ubuntu-latest
        environment: ${{ github.event.inputs.environment }}
        env:
            TF_VAR_AWS_REGION: ${{ vars.AWS_REGION }}
            TF_VAR_APP_NAME: ${{ vars.APP_NAME }}
            TF_VAR_APP_ENVIRONMENT: ${{ github.event.inputs.environment }}
            # Database credentials
            TF_VAR_DATALAYER_PG_USER: ${{ secrets.DATALAYER_PG_USER }}
            TF_VAR_DATALAYER_PG_PASSWORD: ${{ secrets.DATALAYER_PG_PASSWORD }}
        steps:
            - name: Check out github repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Check if user is an admin
              uses: ./.github/actions/check-admin
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v1
              with:
                  terraform_version: ${{ vars.TERRAFORM_VERSION }}
                  terraform_wrapper: false

            - name: Set up AWS CLI
              uses: aws-actions/configure-aws-credentials@v2
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ vars.AWS_REGION }}

            - name: Terraform Init
              working-directory: deployment/environments/${{ github.event.inputs.environment }}
              run: |
                  terraform init \
                    -backend-config="bucket=${{ vars.APP_NAME }}-terraform-state" \
                    -backend-config="key=${{ vars.APP_NAME }}/${{ github.event.inputs.environment }}/terraform.tfstate" \
                    -backend-config="region=${{ vars.AWS_REGION }}"

            - name: Terraform Destroy
              working-directory: deployment/environments/${{ github.event.inputs.environment }}
              run: |
                  echo "🔥 Starting infrastructure destroy..."
                  # For destroy, we can use defaults for most variables since we're tearing everything down
                  # Only the essential variables are needed for Terraform to identify resources
                  cat > tfvars.json << EOF
                  {
                    "BLUE_API_IMAGE_TAG": "latest",
                    "BLUE_CHAINS": [],
                    "BLUE_COINGECKO_API_KEY": "${{ secrets.COINGECKO_API_KEY }}",
                    "BLUE_COINGECKO_API_TYPE": "demo",
                    "BLUE_PRICING_SOURCE": "coingecko",
                    "BLUE_METADATA_SOURCE": "public-gateway",
                    "BLUE_PUBLIC_GATEWAY_URLS": ["https://ipfs.io"],
                    "BLUE_LOG_LEVEL": "info",
                    "BLUE_INDEXER_GRAPHQL_URL": "http://localhost:8080/v1/graphql",
                    "BLUE_DATALAYER_PG_DB_NAME": "grants_stack_indexer"
                  }
                  EOF
                  echo "Variables for destroy:"
                  cat tfvars.json
                  # Destroy the simplified deployment
                  echo "🔥 Destroying infrastructure..."
                  terraform destroy -var-file=tfvars.json -auto-approve
