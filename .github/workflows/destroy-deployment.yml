name: Destroy Environment

on:
    workflow_dispatch:
        inputs:
            environment:
                type: choice
                description: Environment to check
                required: true
                options:
                    - staging
                    - production

jobs:
    destroy:
        name: Destroy ${{ github.event.inputs.environment }}
        runs-on: ubuntu-latest
        environment: ${{ github.event.inputs.environment }}
        env:
            TF_VAR_AWS_REGION: ${{ vars.AWS_REGION }}
            TF_VAR_APP_NAME: ${{ vars.APP_NAME }}
            TF_VAR_APP_ENVIRONMENT: ${{ github.event.inputs.environment }}
            # Database credentials
            TF_VAR_DATALAYER_PG_USER: ${{ secrets.DATALAYER_PG_USER }}
            TF_VAR_DATALAYER_PG_PASSWORD: ${{ secrets.DATALAYER_PG_PASSWORD }}
        steps:
            - name: Check out github repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Check if user is an admin
              uses: ./.github/actions/check-admin
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v1
              with:
                  terraform_version: ${{ vars.TERRAFORM_VERSION }}
                  terraform_wrapper: false

            - name: Set up AWS CLI
              uses: aws-actions/configure-aws-credentials@v2
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ vars.AWS_REGION }}

            - name: Terraform Init
              working-directory: deployment/environments/${{ github.event.inputs.environment }}
              run: |
                  terraform init \
                    -backend-config="bucket=${{ vars.APP_NAME }}-terraform-state" \
                    -backend-config="key=${{ vars.APP_NAME }}-${{ github.event.inputs.environment }}-state" \
                    -backend-config="region=${{ vars.AWS_REGION }}" \
                    -backend-config="encrypt=true"

            - name: Terraform Destroy
              working-directory: deployment/environments/${{ github.event.inputs.environment }}
              run: |
                  # Validate that TERRAFORM_VARS is valid JSON
                  if ! jq empty <<< "$TERRAFORM_VARS" >/dev/null 2>&1; then
                    echo "Error: TERRAFORM_VARS is not valid JSON."
                    exit 1
                  fi
                  # Extract only BLUE variables for simplified deployment (excluding COINGECKO_API_KEY which is a separate secret)
                  echo "$TERRAFORM_VARS" | jq '{
                    BLUE_CHAINS: .BLUE_CHAINS,
                    BLUE_COINGECKO_API_TYPE: .BLUE_COINGECKO_API_TYPE,
                    BLUE_PRICING_SOURCE: .BLUE_PRICING_SOURCE,
                    BLUE_METADATA_SOURCE: .BLUE_METADATA_SOURCE,
                    BLUE_PUBLIC_GATEWAY_URLS: .BLUE_PUBLIC_GATEWAY_URLS,
                    BLUE_LOG_LEVEL: .BLUE_LOG_LEVEL,
                    BLUE_INDEXER_GRAPHQL_URL: .BLUE_INDEXER_GRAPHQL_URL,
                    BLUE_DATALAYER_PG_DB_NAME: .BLUE_DATALAYER_PG_DB_NAME
                  }' > tfvars.json
                  # Add the separate COINGECKO_API_KEY secret
                  jq --arg coingecko_key "${{ secrets.COINGECKO_API_KEY }}" '. + {BLUE_COINGECKO_API_KEY: $coingecko_key}' tfvars.json > tfvars_temp.json && mv tfvars_temp.json tfvars.json
                  # Show what variables we extracted
                  echo "Extracted variables for simplified deployment destroy:"
                  cat tfvars.json
                  # Destroy the simplified deployment
                  terraform destroy -var-file=tfvars.json -auto-approve
              env:
                  TERRAFORM_VARS: ${{ secrets.TERRAFORM_VARS }}
