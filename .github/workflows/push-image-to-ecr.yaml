name: Push Docker Image to ECR

on:
    workflow_dispatch:
    push:
        branches:
            - dev

jobs:
    push-to-ecr:
        runs-on: ubuntu-latest
        
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v3

            - name: Configure AWS Credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
                  aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                  aws-region: ${{ vars.AWS_REGION }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v2

            - name: Log in to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2
              
            - name: Get AWS Account ID
              id: aws-account
              run: echo "account-id=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_OUTPUT
              
            - name: Build Docker Image
              uses: docker/build-push-action@v3
              with:
                  context: .
                  target: processing
                  tags: |
                      ${{ steps.aws-account.outputs.account-id }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.APP_NAME }}-processing:${{ github.sha }}
                      ${{ steps.aws-account.outputs.account-id }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.APP_NAME }}-processing:latest
                  push: true
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
