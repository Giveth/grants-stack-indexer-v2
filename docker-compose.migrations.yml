version: '3.8'

services:
  migrations:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    working_dir: /app/scripts/migrations
    environment:
      - DATABASE_URL=postgresql://${DATALAYER_PG_USER}:${DATALAYER_PG_PASSWORD}@${DATALAYER_PG_HOST}:${DATALAYER_PG_PORT}/${DATALAYER_PG_DATABASE}?sslmode=require
    volumes:
      - .:/app
    command: ["pnpm", "db:migrate"]
    networks:
      - datalayer

networks:
  datalayer:
    name: datalayer_network
    external: true
