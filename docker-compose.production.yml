version: '3.8'

services:
  # Reverse proxy with automatic HTTPS
  caddy:
    container_name: caddy
    image: caddy:2.7-alpine
    restart: unless-stopped
    environment:
      - DOMAIN=${DOMAIN}
      - EMAIL=${EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web
      - datalayer
      - indexer
    depends_on:
      - datalayer-graphql-api
      - indexer-graphql-api

  # Main application processing service
  processing:
    container_name: processing
    build:
      context: .
      dockerfile: Dockerfile
      target: processing
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${DATALAYER_PG_USER}:${DATALAYER_PG_PASSWORD}@${DATALAYER_PG_HOST}:${DATALAYER_PG_PORT}/${DATALAYER_PG_DATABASE}
      - INDEXER_GRAPHQL_URL=http://indexer-graphql-api:8080/v1/graphql
      - INDEXER_ADMIN_SECRET=${HASURA_GRAPHQL_ADMIN_SECRET}
      - CHAINS=${CHAINS}
      - METADATA_SOURCE=${METADATA_SOURCE}
      - PUBLIC_GATEWAY_URLS=${PUBLIC_GATEWAY_URLS}
      - PRICING_SOURCE=${PRICING_SOURCE}
      - COINGECKO_API_KEY=${COINGECKO_API_KEY}
      - COINGECKO_API_TYPE=${COINGECKO_API_TYPE}
      - RETRY_MAX_ATTEMPTS=${RETRY_MAX_ATTEMPTS}
      - RETRY_BASE_DELAY_MS=${RETRY_BASE_DELAY_MS}
      - RETRY_MAX_DELAY_MS=${RETRY_MAX_DELAY_MS}
      - RETRY_FACTOR=${RETRY_FACTOR}
    networks:
      - datalayer
      - indexer
    depends_on:
      - datalayer-graphql-api
      - indexer-graphql-api

  # Datalayer GraphQL API (Hasura)
  datalayer-graphql-api:
    container_name: datalayer-graphql-api
    image: hasura/graphql-engine:v2.43.0
    restart: unless-stopped
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgresql://${DATALAYER_PG_USER}:${DATALAYER_PG_PASSWORD}@${DATALAYER_PG_HOST}:${DATALAYER_PG_PORT}/${DATALAYER_PG_DATABASE}
      HASURA_GRAPHQL_ENABLE_CONSOLE: "false"
      HASURA_GRAPHQL_ADMIN_SECRET: ${DATALAYER_HASURA_ADMIN_SECRET}
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: ${DATALAYER_HASURA_UNAUTHORIZED_ROLE}
      HASURA_GRAPHQL_CORS_DOMAIN: ${DATALAYER_HASURA_CORS_DOMAIN}
      HASURA_GRAPHQL_ENABLE_TELEMETRY: "false"
      HASURA_GRAPHQL_EXPERIMENTAL_FEATURES: "bigquery_string_numeric_input,naming_convention"
      HASURA_GRAPHQL_DEFAULT_NAMING_CONVENTION: "graphql-default"
      HASURA_GRAPHQL_BIGQUERY_STRING_NUMERIC_INPUT: "true"
      HASURA_GRAPHQL_DEV_MODE: "false"
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: "startup, http-log, webhook-log, websocket-log, query-log"
      HASURA_GRAPHQL_ADMIN_INTERNAL_ERRORS: "false"
    networks:
      - datalayer
      - web
    healthcheck:
      test: timeout 1s bash -c ':> /dev/tcp/127.0.0.1/8080' || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Indexer GraphQL API (Hasura)
  indexer-graphql-api:
    container_name: indexer-graphql-api
    image: hasura/graphql-engine:v2.43.0
    restart: unless-stopped
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgresql://${ENVIO_PG_USER}:${ENVIO_PG_PASSWORD}@${ENVIO_PG_HOST}:${ENVIO_PG_PORT}/${ENVIO_PG_DATABASE}
      HASURA_GRAPHQL_ENABLE_CONSOLE: "false"
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET}
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: ${HASURA_GRAPHQL_UNAUTHORIZED_ROLE}
      HASURA_GRAPHQL_STRINGIFY_NUMERIC_TYPES: "true"
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: "startup, http-log, webhook-log, websocket-log, query-log"
      HASURA_GRAPHQL_NO_OF_RETRIES: 10
      PORT: 8080
    networks:
      - indexer
      - web
    healthcheck:
      test: timeout 1s bash -c ':> /dev/tcp/127.0.0.1/8080' || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Blockchain indexer service
  indexer:
    container_name: indexer
    build:
      context: ./apps/indexer
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - ENVIO_PG_HOST=${ENVIO_PG_HOST}
      - ENVIO_PG_PORT=${ENVIO_PG_PORT}
      - ENVIO_PG_USER=${ENVIO_PG_USER}
      - ENVIO_PG_PASSWORD=${ENVIO_PG_PASSWORD}
      - ENVIO_PG_DATABASE=${ENVIO_PG_DATABASE}
      - HASURA_GRAPHQL_ENDPOINT=http://indexer-graphql-api:8080/v1/metadata
      - TUI_OFF=true
    networks:
      - indexer
    depends_on:
      indexer-graphql-api:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:

networks:
  web:
    name: web_network
  indexer:
    name: indexer_network
  datalayer:
    name: datalayer_network
